name: Deploy
# Builds the image on every push to main, publishes it to GitHub Container Registry,
# then (if the HETZNER_* secrets exist) runs deploy/remote-deploy.sh on the server over SSH:
# first run sets everything up, later runs pull the new image and recreate the wander container.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.HETZNER_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to the server
        if: env.HAS_SERVER == 'true'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          WANDER_IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Secrets travel over the SSH session's stdin, never on a command line.
          {
            printf 'export GEMINI_API_KEY=%q AERODATABOX_API_KEY=%q GHCR_TOKEN=%q GHCR_USER=%q WANDER_IMAGE=%q\n' \
              "$GEMINI_API_KEY" "$AERODATABOX_API_KEY" "$GHCR_TOKEN" "$GHCR_USER" "$WANDER_IMAGE"
            cat deploy/remote-deploy.sh
          } | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                "$SSH_USER@$SSH_HOST" 'bash -s'
