# nginx: save as /etc/nginx/sites-available/wander.conf, symlink into sites-enabled,
# then run: certbot --nginx -d wander.anmolmathur.com
server {
    listen 80;
    server_name wander.anmolmathur.com;
    client_max_body_size 15m;   # boarding-pass images for Smart add

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # Gemini calls can take a while
    }
}
